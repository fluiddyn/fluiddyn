name: CI Windows

on:
  - push
  - pull_request

jobs:
  tests:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v5
    - uses: prefix-dev/setup-pixi@v0.9.2
      with:
        pixi-version: v0.55.0
        cache: false
    - name: Tests
      run: |
        pixi run install-editable
        pixi run pytest fluiddyn
